version: '3.8'

services:
  gizmosbuyweb:
    image: gizmosbuyweb:latest        # Custom image name for your app
    build:
      context: .
      dockerfile: Dockerfile          # Make sure your project has a Dockerfile
    ports:
      - "8080:80"                     # Expose app on host port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    restart: always
    networks:
      - gizmosnet

  # Optional: SQL Server container for local dev/test
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gizmosbuyweb-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    restart: always
    networks:
      - gizmosnet

networks:
  gizmosnet:
    driver: bridge
